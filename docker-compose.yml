# Local development stack. NOTE: written but not executed in the authoring sandbox (no Docker daemon).
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: finapp
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-finapp}
      POSTGRES_DB: finapp
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finapp"]
      interval: 5s
      retries: 10
    ports: ["127.0.0.1:5432:5432"]
  api:
    build: ./backend
    env_file: [.env]
    environment:
      DATABASE_URL: postgresql+psycopg://finapp:${POSTGRES_PASSWORD:-finapp}@db:5432/finapp
    depends_on:
      db: { condition: service_healthy }
    ports: ["127.0.0.1:8000:8000"]
  web:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000/api
    depends_on: [api]
    ports: ["127.0.0.1:3000:3000"]
volumes:
  pgdata:
