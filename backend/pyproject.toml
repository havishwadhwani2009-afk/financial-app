[project]
name = "finintel-backend"
version = "0.1.0"
description = "Financial intelligence & forecasting platform - backend"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115", "uvicorn[standard]>=0.30", "sqlalchemy>=2.0", "alembic>=1.13",
  "psycopg[binary]>=3.2", "pydantic>=2.7", "pydantic-settings>=2.3",
  "pandas>=2.2", "numpy>=1.26", "scikit-learn>=1.5", "statsmodels>=0.14",
  "httpx>=0.27", "tenacity>=8.3", "slowapi>=0.1.9",
]
[project.optional-dependencies]
dev = ["pytest>=8", "pytest-httpx>=0.30"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["ignore::DeprecationWarning"]
